name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: better-cf-ip-c-linux-x86_64

          - os: macos-latest
            artifact_name: better-cf-ip-c-darwin-arm64

          - os: macos-13
            artifact_name: better-cf-ip-c-darwin-x86_64

          - os: windows-latest
            artifact_name: better-cf-ip-c-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Windows: MSYS2 setup ---
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkg-config
            make

      # --- Install dependencies (non-Windows) ---
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: brew install openssl pkg-config

      # --- Build ---
      - name: Build release
        if: runner.os != 'Windows'
        run: make release

      - name: Build release
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make release

      # --- Test (Linux only) ---
      - name: Build and run tests
        if: runner.os == 'Linux'
        run: make test

      # --- Rename binary ---
      - name: Rename binary for upload
        if: runner.os != 'Windows'
        run: mv better-cf-ip-c ${{ matrix.artifact_name }}

      - name: Rename binary for upload
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: mv better-cf-ip-c.exe ${{ matrix.artifact_name }}

      # --- Upload artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # --- Download all platform artifacts ---
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # --- Generate SHA256 checksums ---
      - name: Generate checksums
        run: |
          sha256sum artifacts/*/* > artifacts/checksums.txt
          cat artifacts/checksums.txt

      # --- Create GitHub Release ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
          prerelease: ${{ contains(github.ref_name, '-') }}
